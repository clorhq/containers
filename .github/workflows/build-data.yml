name: build-data
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Immutable software-development-base image ref
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test the Data image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/data/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=${{ inputs.base_ref }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=data-${{ matrix.arch }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/data/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=${{ inputs.base_ref }}
          outputs: type=image,name=ghcr.io/clorhq/software-development-data,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=data-${{ matrix.arch }}
      - name: Test Data service readiness
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/clorhq/software-development-data@${IMAGE_DIGEST}"
          bash images/data/tests/runtime "${IMAGE}"
      - name: Export digest
        run: |
          mkdir --parents /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-data-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge-data:
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-data-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tag
        working-directory: /tmp/digests
        run: |
          test "$(find . -maxdepth 1 -type f | wc --lines)" -eq 2
          docker buildx imagetools create \
            --tag ghcr.io/clorhq/software-development-data:latest \
            $(printf 'ghcr.io/clorhq/software-development-data@sha256:%s ' *)
          docker buildx imagetools inspect \
            ghcr.io/clorhq/software-development-data:latest
