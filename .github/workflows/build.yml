name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      data_only:
        description: Build only the Data image against base_ref
        required: false
        default: false
        type: boolean
      base_ref:
        description: Immutable Base ref used by a Data-only build
        required: false
        type: string
      merge_data_only:
        description: Assemble Data from supplied architecture digests
        required: false
        default: false
        type: boolean
      data_amd64_digest:
        description: Data AMD64 digest used by a merge-only run
        required: false
        type: string
      data_arm64_digest:
        description: Data ARM64 digest used by a merge-only run
        required: false
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: build-${{ github.ref }}-${{ inputs.merge_data_only && 'data-merge' || inputs.data_only && 'data' || 'full' }}
  cancel-in-progress: true
jobs:
  # Each architecture builds on its native runner and pushes by digest; the
  # merge jobs stitch the digests into one multi-arch tag. No QEMU anywhere.
  base:
    if: ${{ !inputs.data_only && !inputs.merge_data_only }}
    strategy:
      # One architecture failing must not cancel the other: the surviving job
      # is what says whether a failure is architecture specific.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The test stage is a superset of production -- both are FROM base -- so
      # this one step is the only cache writer per image and architecture.
      # A second writer on the same scope would race the first for the key.
      - name: Test the base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/base/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          build-args: CLOR_BUILD_NONCE=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.arch }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Layers ship zstd rather than gzip: smaller on the wire and markedly
      # faster to decompress, which is on the critical path for a plain Docker
      # node creating a space. force-compression recompresses layers that
      # arrive already gzipped, so an image is never a mix of the two. Every
      # node must be on Docker Engine 23.0 or newer to pull these.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/base/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          build-args: CLOR_BUILD_NONCE=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=image,name=ghcr.io/clorhq/software-development-base,push-by-digest=true,name-canonical=true,push=true,compression=zstd,oci-mediatypes=true,force-compression=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=base-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir --parents /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge-base:
    needs: base
    if: ${{ !inputs.data_only && !inputs.merge_data_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-base-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tag
        working-directory: /tmp/digests
        run: |
          test "$(find . -maxdepth 1 -type f | wc --lines)" -eq 2
          IMAGE_REFS=()
          for DIGEST in *; do
            IMAGE_REFS+=("ghcr.io/clorhq/software-development-base@sha256:${DIGEST}")
          done
          docker buildx imagetools create \
            --tag ghcr.io/clorhq/software-development-base:latest \
            "${IMAGE_REFS[@]}"
          docker buildx imagetools inspect ghcr.io/clorhq/software-development-base:latest
  variants:
    needs: merge-base
    strategy:
      fail-fast: false
      matrix:
        image: [desktop, devops]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test the desktop image
        if: ${{ matrix.image == 'desktop' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/desktop/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=ghcr.io/clorhq/software-development-base:latest
          outputs: type=cacheonly
          cache-from: type=gha,scope=desktop-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=desktop-${{ matrix.arch }}
      - name: Test the DevOps image
        if: ${{ matrix.image == 'devops' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/devops/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=ghcr.io/clorhq/software-development-base:latest
          outputs: type=cacheonly
          cache-from: type=gha,scope=devops-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=devops-${{ matrix.arch }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=ghcr.io/clorhq/software-development-base:latest
          outputs: type=image,name=ghcr.io/clorhq/software-development-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,oci-mediatypes=true,force-compression=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Test the desktop runtime
        if: ${{ matrix.image == 'desktop' }}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/clorhq/software-development-desktop@${IMAGE_DIGEST}"
          bash images/desktop/tests/runtime "${IMAGE}"
      - name: Export digest
        run: |
          mkdir --parents /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge-variants:
    needs: variants
    if: ${{ !inputs.data_only && !inputs.merge_data_only && always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [desktop, devops]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tag
        working-directory: /tmp/digests
        run: |
          test "$(find . -maxdepth 1 -type f | wc --lines)" -eq 2
          IMAGE_REFS=()
          for DIGEST in *; do
            IMAGE_REFS+=("ghcr.io/clorhq/software-development-${{ matrix.image }}@sha256:${DIGEST}")
          done
          docker buildx imagetools create \
            --tag ghcr.io/clorhq/software-development-${{ matrix.image }}:latest \
            "${IMAGE_REFS[@]}"
          docker buildx imagetools inspect \
            ghcr.io/clorhq/software-development-${{ matrix.image }}:latest
  data:
    needs: merge-base
    if: ${{ !inputs.merge_data_only && always() && (inputs.data_only || needs.merge-base.result == 'success') }}
    strategy:
      # One architecture failing must not cancel the other: the surviving job
      # is what says whether a failure is architecture specific.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test the Data image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/data/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=${{ inputs.data_only && inputs.base_ref || 'ghcr.io/clorhq/software-development-base:latest' }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=data-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=data-${{ matrix.arch }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/data/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=${{ inputs.data_only && inputs.base_ref || 'ghcr.io/clorhq/software-development-base:latest' }}
          outputs: type=image,name=ghcr.io/clorhq/software-development-data,push-by-digest=true,name-canonical=true,push=true,compression=zstd,oci-mediatypes=true,force-compression=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=data-${{ matrix.arch }}
      - name: Test Data service readiness
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/clorhq/software-development-data@${IMAGE_DIGEST}"
          bash images/data/tests/runtime "${IMAGE}"
      - name: Export digest
        run: |
          mkdir --parents /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-data-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge-data:
    needs: data
    if: ${{ always() && (inputs.merge_data_only || needs.data.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.merge_data_only }}
        with:
          path: /tmp/digests
          pattern: digests-data-*
          merge-multiple: true
      - name: Stage supplied architecture digests
        if: ${{ inputs.merge_data_only }}
        env:
          AMD64_DIGEST: ${{ inputs.data_amd64_digest }}
          ARM64_DIGEST: ${{ inputs.data_arm64_digest }}
        run: |
          case "${AMD64_DIGEST}" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          case "${ARM64_DIGEST}" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          test "${#AMD64_DIGEST}" -eq 71
          test "${#ARM64_DIGEST}" -eq 71
          mkdir --parents /tmp/digests
          touch "/tmp/digests/${AMD64_DIGEST#sha256:}"
          touch "/tmp/digests/${ARM64_DIGEST#sha256:}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tag and record its digest
        working-directory: /tmp/digests
        run: |
          test "$(find . -maxdepth 1 -type f | wc --lines)" -eq 2
          IMAGE_REFS=()
          for DIGEST in *; do
            IMAGE_REFS+=("ghcr.io/clorhq/software-development-data@sha256:${DIGEST}")
          done
          docker buildx imagetools create \
            --tag ghcr.io/clorhq/software-development-data:latest \
            "${IMAGE_REFS[@]}"
          docker buildx imagetools inspect \
            ghcr.io/clorhq/software-development-data:latest
