command = [
    "/home/user/.local/bin/jupyter-lab",
    "--no-browser",
    "--ip=0.0.0.0",
    "--port=8888",
    "--ServerApp.root_dir=.",
    "--ServerApp.token=",
    "--ServerApp.password=",
    "--IdentityProvider.token=",
]
readiness_port = 8888
restart = "always"

[environment]
JUPYTER_PLATFORM_DIRS = "1"
