# Claude Code and Codex use modified Enter keys for multiline input. Advertise
# extended-key support to tmux and use csi-u so those modifiers reach the TUI.
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm*:extkeys"

# Let terminal notifications and progress indicators reach the outer terminal,
# and forward focus changes so Codex's default unfocused notifications work.
set -g allow-passthrough on
set -g focus-events on

# tmux only emits 24-bit colour when the outer terminal advertises RGB. Without
# these features, truecolor TUIs are silently downsampled to the 256-colour cube.
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",screen*:RGB"
set -as terminal-features ",tmux*:RGB"
