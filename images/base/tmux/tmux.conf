# tmux only emits 24-bit colour when the outer terminal advertises RGB, and
# xterm-256color's terminfo entry does not carry the capability. Without this
# every truecolor TUI running under tmux is silently downsampled to the 256
# colour cube, which is why colour-heavy programs look washed out while
# 256-colour ones look correct. COLORTERM is already truecolor in this image.
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",screen*:RGB"
set -as terminal-features ",tmux*:RGB"
